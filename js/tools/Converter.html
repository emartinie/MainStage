<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML to JSON Formatter</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #f8f9fa; }
    textarea { width: 100%; height: 150px; margin-bottom: 1rem; font-family: monospace; }
    pre { background: #272822; color: #f8f8f2; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 4px; background: #007bff; color: #fff; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h2>HTML/Text → JSON Converter</h2>
  <p>Paste your HTML or text below:</p>
  <textarea id="input"></textarea>
  <br>
  <button onclick="convert()">Convert</button>

  <h3>Output JSON:</h3>
  <pre id="output"></pre>

  <script>
    function convert() {
      const raw = document.getElementById("input").value;
      const jsonReady = JSON.stringify(raw); // escape quotes, newlines, etc
      document.getElementById("output").textContent = `{\n  "content": ${jsonReady}\n}`;
    }
  </script>

</body>
</html>
