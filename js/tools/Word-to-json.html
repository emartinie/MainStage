<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WordPress Text to Safe JSON</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 700px; margin: auto; }
  textarea { width: 100%; height: 150px; margin-bottom: 1rem; font-family: monospace; }
  pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
  button { padding: 0.5rem 1rem; font-size: 1rem; }
</style>
</head>
<body>

<h1>WordPress Text → Safe JSON</h1>

<label for="rawText">Paste your WordPress paragraph(s) here:</label>
<textarea id="rawText" placeholder="Paste text here..."></textarea>

<label for="weekNum">Week number (optional):</label>
<input type="number" id="weekNum" min="1" max="52" value="1">

<br><br>
<button id="convertBtn">Convert to Safe JSON</button>

<h2>Clean JSON Output</h2>
<pre id="output">Your safe JSON will appear here...</pre>

<script>
function cleanForJson(rawText) {
  if (!rawText || typeof rawText !== "string") return "";

  return rawText
    .replace(/[\u2018\u2019\u201A\u201B\u2032\u2035]/g, "'")  // single quotes
    .replace(/[\u201C\u201D\u201E\u201F\u2033\u2036]/g, '"') // double quotes
    .replace(/\u00A0/g, " ")        // non-breaking spaces
    .replace(/&nbsp;/g, " ")
    .replace(/<\/?[^>]+(>|$)/g, "") // strip HTML tags
    .replace(/\r\n|\r|\n/g, " ")    // convert line breaks to spaces
    .replace(/\s\s+/g, " ")         // collapse multiple spaces
    .trim();
}

function convertToJson() {
  const raw = document.getElementById("rawText").value;
  const week = parseInt(document.getElementById("weekNum").value) || 1;

  const paragraphs = raw.split(/\n{1,}/) // split by any empty line
    .map(p => cleanForJson(p))
    .filter(p => p.length > 0)
    .map((text, i) => ({ id: i+1, text }));

  const weekData = { week: week, paragraphs };
  document.getElementById("output").textContent = JSON.stringify(weekData, null, 2);
}

// Button click
document.getElementById("convertBtn").addEventListener("click", convertToJson);
</script>

</body>
</html>
