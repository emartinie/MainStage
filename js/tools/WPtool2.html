<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WP XML → JSON Converter</title>
<style>
  body { font-family: sans-serif; padding: 1rem; background: #f5f5f5; }
  textarea { width: 100%; height: 300px; margin-top: 1rem; }
  button { margin: 0.5rem 0; padding: 0.5rem 1rem; }
</style>
</head>
<body>

<h2>WP XML → JSON Converter</h2>

<input type="file" id="fileInput" accept=".xml">
<button id="parseBtn">Parse File</button>
<button id="downloadBtn">Download JSON</button>

<h3>Preview JSON</h3>
<textarea id="jsonOutput" placeholder="JSON will appear here..."></textarea>

<script>
function cleanContent(raw) {
  if (!raw) return "";
  let content = raw;

  // Remove WP shortcodes [shortcode]
  content = content.replace(/\[.*?\]/g, "");

  // Remove comments
  content = content.replace(/<!--[\s\S]*?-->/g, "");

  // Remove inline styles
  content = content.replace(/\s*style="[^"]*"/g, "");

  // Remove span and other unnecessary tags but keep inner text
  content = content.replace(/<\/?span[^>]*>/g, "");

  // Replace <br> with newline
  content = content.replace(/<br\s*\/?>/gi, "\n");

  // Remove all other tags except <p>, keep paragraph separation
  content = content.replace(/<\/?[^p][^>]*>/g, "");

  // Trim each paragraph
  content = content.split(/<\/p>/i).map(p => p.replace(/<p[^>]*>/i, "").trim()).filter(p => p).join("\n\n");

  return content;
}

// Helper to get text inside XML tag
function getText(item, tag) {
  const el = item.getElementsByTagName(tag)[0];
  return el ? el.textContent : "";
}

let parsedPosts = [];

document.getElementById("parseBtn").addEventListener("click", () => {
  const fileInput = document.getElementById("fileInput");
  if (!fileInput.files.length) return alert("Select a .xml file first");

  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    const xml = e.target.result;
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xml, "text/xml");
    const items = xmlDoc.getElementsByTagName("item");

    parsedPosts = [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const title = getText(item, "title");
      const content = cleanContent(getText(item, "content:encoded") || "");
      const excerpt = cleanContent(getText(item, "excerpt:encoded") || "");
      const link = getText(item, "link");
      const date = getText(item, "pubDate");

      parsedPosts.push({ title, content, excerpt, link, date });
    }

    document.getElementById("jsonOutput").value = JSON.stringify(parsedPosts, null, 2);
    alert(Parsed ${parsedPosts.length} posts.);
  };
  reader.readAsText(file);
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  if (!parsedPosts.length) return alert("No parsed data to download!");
  const blob = new Blob([JSON.stringify(parsedPosts, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wp_export.json";
  a.click();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
