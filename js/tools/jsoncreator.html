<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML to JSON Converter</title>
</head>
<body>
  <h2>HTML → JSON Converter</h2>
  
  <label>File name (without .json):</label><br>
  <input type="text" id="filename" placeholder="example"><br><br>
  
  <label>Paste your content:</label><br>
  <textarea id="content" rows="12" cols="80"></textarea><br><br>
  
  <button onclick="downloadJSON()">Create JSON</button>
  
  <script>
    function downloadJSON() {
      const filename = document.getElementById("filename").value.trim() || "output";
      const rawText = document.getElementById("content").value.trim();

      // Wrap content into JSON structure
      const jsonData = {
        sections: [
          {
            id: 1,
            content: rawText
          }
        ]
      };

      const blob = new Blob([JSON.stringify(jsonData, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename + ".json";
      link.click();
    }
  </script>
</body>
</html>
