<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WP XML → JSON Cleaner</title>
<style>
  body { font-family: sans-serif; padding: 1rem; background: #f5f5f5; }
  textarea { width: 100%; height: 200px; margin-top: 1rem; font-family: monospace; }
  button { margin: 0.5rem 0; padding: 0.5rem 1rem; }
  .section { margin-bottom: 1rem; }
</style>
</head>
<body>

<h2>WP XML → JSON Converter</h2>
<input type="file" id="fileInput" accept=".xml">
<button id="parseBtn">Parse XML File</button>

<h3>Parsed JSON Output</h3>
<textarea id="jsonOutput" placeholder="Parsed JSON will appear here..."></textarea>
<button id="downloadBtn">Download JSON</button>

<script>
// --- Clean HTML content ---
function cleanContent(raw) {
  if (!raw) return null;

  let content = raw;

  // Remove shortcodes and comments
  content = content.replace(/\[.*?\]/g, "");
  content = content.replace(/<!--[\s\S]*?-->/g, "");

  // Remove inline styles & spans
  content = content.replace(/\s*style="[^"]*"/g, "");
  content = content.replace(/<\/?span[^>]*>/g, "");

  // Convert <br> to newline
  content = content.replace(/<br\s*\/?>/gi, "\n");

  // Keep paragraphs and blockquotes
  let paragraphs = [];
  const tempDiv = document.createElement("div");
  tempDiv.innerHTML = content;

  Array.from(tempDiv.childNodes).forEach(node => {
    if (node.nodeType === 3) { // text node
      if (node.textContent.trim()) paragraphs.push({ type: "text", text: node.textContent.trim() });
    } else if (node.tagName === "P") {
      const txt = node.textContent.trim();
      if (txt) paragraphs.push({ type: "paragraph", text: txt });
    } else if (node.tagName === "BLOCKQUOTE") {
      const txt = node.textContent.trim();
      if (txt) paragraphs.push({ type: "blockquote", text: txt });
    }
  });

  return paragraphs.length ? paragraphs : null;
}

// --- Get XML text safely ---
function getText(item, tag) {
  const el = item.getElementsByTagName(tag)[0];
  return el ? el.textContent.trim() : null;
}

// --- Parse XML ---
document.getElementById("parseBtn").addEventListener("click", () => {
  const fileInput = document.getElementById("fileInput");
  if (!fileInput.files.length) return alert("Select a .xml file first");

  const reader = new FileReader();
  reader.onload = function(e) {
    const xml = e.target.result;
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xml, "text/xml");
    const items = xmlDoc.getElementsByTagName("item");

    const parsedPosts = [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const post = {};

      const title = getText(item, "title");
      if (title) post.title = title;

      const content = cleanContent(getText(item, "content:encoded"));
      if (content) post.content = content;

      const excerpt = cleanContent(getText(item, "excerpt:encoded"));
      if (excerpt) post.excerpt = excerpt;

      const link = getText(item, "link");
      if (link) post.link = link;

      const date = getText(item, "pubDate");
      if (date) post.date = date;

      parsedPosts.push(post);
    }

    document.getElementById("jsonOutput").value = JSON.stringify(parsedPosts, null, 2);
    alert(Parsed ${parsedPosts.length} posts);
  };
  reader.readAsText(fileInput.files[0]);
});

// --- Download JSON ---
document.getElementById("downloadBtn").addEventListener("click", () => {
  const data = document.getElementById("jsonOutput").value;
  if (!data) return alert("No JSON data to download!");
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wp_cleaned.json";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
