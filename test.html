  <style>

    .cosmic-card {
      display: flex;
      flex-direction: column;
      height: 100vh; /* full viewport height for testing */
      min-height: 300px;
    }

    #map {
      flex-grow: 1;
    }

           /* Extra badass polish */
    #bibleStage {
      perspective: 1200px;
      overflow: hidden;
    }
    .bibleCard {
      flex: 0 0 100%;
      transition: transform 0.6s ease, opacity 0.6s ease;
      backface-visibility: hidden;
    }
    .bibleCard.inactive {
      opacity: 0;
      transform: scale(0.9) rotateY(15deg);
    }
    .bibleCard.active {
      opacity: 1;
      transform: scale(1) rotateY(0deg);
    }


/* Optional: force the floating player to scale on small screens */
.floating-player {
  max-width: 90vw;
  max-height: 90vh;
  position: fixed;
  bottom: 1rem;
  right: 1rem;
  z-index: 9999;
}

    /* Optional bounce animation for hero card */
    @keyframes bounce-slow { 0%,100%{transform:translateY(-5%);}50%{transform:translateY(5%);} }

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0d0d2b, #1a1a3d);
  overflow-x: hidden;
}

.carousel-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.carousel-track {
  display: flex;
  transition: transform 0.6s ease-in-out;
}

.card {
  flex: 0 0 80vw;
  height: 70vh;
  margin: 0 10vw;
  background: linear-gradient(135deg, #3a0ca3, #7209b7);
  border-radius: 2rem;
  box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
  color: white;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  transform: scale(0.9);
  transition: transform 0.5s ease, box-shadow 0.5s ease;
}

.card.active {
  transform: scale(1);
  box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
}

.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  font-size: 2rem;
  cursor: pointer;
  padding: 1rem 1.5rem;
  border-radius: 50%;
  transition: background 0.3s;
  z-index: 10;
}

.nav-btn:hover {
  background: rgba(255,255,255,0.3);
}

.prev-btn { left: 2rem; }
.next-btn { right: 2rem; }

</style>

<body>

  <button class="nav-btn prev-btn">◀</button>
  <button class="nav-btn next-btn">▶</button>
</div>
