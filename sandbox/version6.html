<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore/leaflet-omnivore.min.js"></script>
<title>version6</title>
<style>
  .card {
    @apply relative bg-gray-800 text-white p-6 rounded-3xl shadow-2xl mx-auto my-8 w-96 opacity-0 scale-90;
  }
</style>
</head>
<body class="bg-gray-900 flex flex-col items-center min-h-screen justify-center">

<!-- Placeholder cards -->
<div id="MapCard" class="card">
<div id="map">
<script>
    // Initialize map
    const map = L.map("map").setView([39.5, -98.35], 4);

    // Base layer
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // Cluster group
    const markers = L.markerClusterGroup();

    // Load your GeoJSON
    fetch("HomeGroupsMap.geojson")
      .then((response) => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then((data) => {
        data.features.forEach((feature, idx) => {
          const coordsStr = feature.properties.Coordinates;
          if (!coordsStr) {
            console.warn`(Feature ${idx} missing Coordinates)`;
            return;
          }
          const coords = coordsStr.split(",").map(Number);
          if (coords.length < 2) {
            console.warn`(Feature ${idx} has invalid Coordinates)`;
            return;
          }
          const [lon, lat] = coords;

          // Create marker using coordinates
          const marker = L.marker([lat, lon]);

          // Bind popup (name + optional extra info)
          marker.bindPopup(
            `<strong>${feature.properties.Name || "Unnamed"}</strong>`
          );

          markers.addLayer(marker);
        });

        // Add cluster group to map
        map.addLayer(markers);
      })
      .catch((err) => console.error("Error loading GeoJSON:", err));
  </script>
 </div>
</div>

<!-- Navigation -->
<div class="flex gap-4 mt-4">
  <button id="prevBtn" class="px-4 py-2 bg-blue-600 rounded">Prev</button>
  <button id="nextBtn" class="px-4 py-2 bg-blue-600 rounded">Next</button>
</div>



<div id="MainCard" class="card">
</div>
<div id="CalendarCard" class="card">Calendar Card Content</div>


<script>
document.addEventListener("DOMContentLoaded", () => {
  const cardIds = ["MainCard", "CalendarCard", "MapCard"];
  const cards = cardIds.map(id => document.getElementById(id)).filter(Boolean);

  if (!cards.length) return;

  let currentIndex = 0;

  const transitions = [
    "translate-x-20",
    "-translate-x-20",
    "translate-y-20",
    "-translate-y-20",
    "rotate-12",
    "-rotate-12",
    "scale-90"
  ];

  function showCard(index) {
    cards.forEach((card, i) => {
      if (i === index) {
        const randomClass = transitions[Math.floor(Math.random() * transitions.length)];

        // Reset classes
        card.classList.remove(...transitions);
        card.classList.add(randomClass, "opacity-0", "scale-90");

        // Force reflow
        void card.offsetWidth;

        // Animate in
        card.classList.add("transition-all", "duration-700");
        card.classList.remove("opacity-0", "scale-90", randomClass);
      } else {
        card.classList.add("opacity-0", "scale-90");
      }
    });

    currentIndex = index;
  }

  document.getElementById("prevBtn").addEventListener("click", () => {
    const nextIndex = (currentIndex - 1 + cards.length) % cards.length;
    showCard(nextIndex);
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    const nextIndex = (currentIndex + 1) % cards.length;
    showCard(nextIndex);
  });

  // Initial display
  showCard(0);
});
</script>

</body>
</html>
