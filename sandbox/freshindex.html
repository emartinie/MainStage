<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

  <!-- Carousel -->
  <div class="relative w-full max-w-md overflow-hidden">
    <!-- Track -->
    <div id="carouselTrack" class="flex transition-transform duration-500">
      <div class="min-w-full flex items-center justify-center bg-gray-700 h-64 rounded-xl">Card 1</div>
      <div class="min-w-full flex items-center justify-center bg-gray-600 h-64 rounded-xl">Card 2</div>
      <div class="min-w-full flex items-center justify-center bg-gray-500 h-64 rounded-xl">Card 3</div>
    </div>

    <!-- Controls -->
    <button id="prevBtn" class="absolute top-1/2 -left-4 transform -translate-y-1/2 bg-gray-800 p-2 rounded-full shadow hover:bg-gray-700">
      ◀
    </button>
    <button id="nextBtn" class="absolute top-1/2 -right-4 transform -translate-y-1/2 bg-gray-800 p-2 rounded-full shadow hover:bg-gray-700">
      ▶
    </button>
  </div>

  <script>
    const track = document.getElementById("carouselTrack");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let index = 0;
    const totalSlides = track.children.length;

    function updateCarousel() {
      track.style.transform = translateX(-${index * 100}%);
    }

    nextBtn.addEventListener("click", () => {
      index = (index + 1) % totalSlides;
      updateCarousel();
    });

    prevBtn.addEventListener("click", () => {
      index = (index - 1 + totalSlides) % totalSlides;
      updateCarousel();
    });

    // Touch/swipe support
    let startX = 0;
    track.addEventListener("touchstart", (e) => startX = e.touches[0].clientX);
    track.addEventListener("touchend", (e) => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) nextBtn.click();
      if (endX - startX > 50) prevBtn.click();
    });
  </script>
</body>
</html>
