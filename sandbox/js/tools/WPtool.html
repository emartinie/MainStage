<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WordPress XML to JSON Converter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    textarea { width: 100%; height: 120px; margin: 5px 0; }
    .post { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>WordPress XML → JSON Converter</h1>

  <input type="file" id="xmlFile" accept=".xml"><br><br>
  <button id="exportBtn" class="hidden">Export JSON</button>
  <hr>

  <div id="posts"></div>

  <script>
    let parsedPosts = [];

    document.getElementById("xmlFile").addEventListener("change", handleFile);

    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(e.target.result, "text/xml");
        const items = xmlDoc.getElementsByTagName("item");

        parsedPosts = [];
        const container = document.getElementById("posts");
        container.innerHTML = "";

        Array.from(items).forEach((item, index) => {
          const title = getText(item, "title");
          const content = getText(item, "content:encoded") || "";
          const excerpt = getText(item, "excerpt:encoded") || "";
          const category = getText(item, "category") || "";
          const pubDate = getText(item, "pubDate");

          const postObj = {
            id: index + 1,
            title: title,
            excerpt: excerpt,
            category: category,
            date: pubDate,
            content: content
          };

          parsedPosts.push(postObj);

          // Render editable section
          const div = document.createElement("div");
          div.className = "post";
          div.innerHTML = `
            <h3>Post ${index + 1}: ${title}</h3>
            <label>Title:</label>
            <textarea data-field="title" data-index="${index}">${title}</textarea>
            <label>Excerpt:</label>
            <textarea data-field="excerpt" data-index="${index}">${excerpt}</textarea>
            <label>Category:</label>
            <textarea data-field="category" data-index="${index}">${category}</textarea>
            <label>Date:</label>
            <textarea data-field="date" data-index="${index}">${pubDate}</textarea>
            <label>Content:</label>
            <textarea data-field="content" data-index="${index}">${content}</textarea>
          `;
          container.appendChild(div);
        });

        document.getElementById("exportBtn").classList.remove("hidden");
        container.addEventListener("input", updatePost);
      };
      reader.readAsText(file);
    }

    function getText(item, tag) {
      const el = item.getElementsByTagName(tag)[0];
      return el ? el.textContent.trim() : "";
    }

    function updatePost(e) {
      if (e.target.tagName !== "TEXTAREA") return;
      const field = e.target.dataset.field;
      const index = e.target.dataset.index;
      parsedPosts[index][field] = e.target.value;
    }

    document.getElementById("exportBtn").addEventListener("click", () => {
      const jsonStr = JSON.stringify(parsedPosts, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "wordpress-export.json";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
