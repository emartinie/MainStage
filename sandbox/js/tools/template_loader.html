<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Content → JSON Tool</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    textarea { width: 100%; margin: 5px 0; }
    pre { background: #f4f4f4; padding: 10px; }
    .field { margin-bottom: 15px; }
  </style>
</head>
<body>
  <h2>Content → JSON Converter</h2>
  
  <label>File name (without .json):</label><br>
  <input type="text" id="filename" placeholder="example"><br><br>

  <button onclick="switchMode('basic')">Basic Mode</button>
  <button onclick="switchMode('template')">Template Mode</button>
  <input type="file" id="templateUpload" accept=".json" onchange="loadTemplate(event)">
  <button onclick="downloadJSON()">Download JSON</button>
  
  <div id="inputArea"></div>
  
  <h3>Preview</h3>
  <pre id="preview"></pre>

  <script>
    let currentJSON = null;
    let mode = "basic";
    let templateSchema = {
      title: "",
      author: "",
      sections: [
        { id: 1, heading: "", content: "" },
        { id: 2, heading: "", content: "" }
      ]
    };

    function cleanText(input) {
      return input.replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
    }

    function switchMode(newMode) {
      mode = newMode;
      const area = document.getElementById("inputArea");
      area.innerHTML = "";

      if (mode === "basic") {
        area.innerHTML = `
          <label>Paste your content:</label><br>
          <textarea id="content" rows="12"></textarea><br>
          <button onclick="convertBasic()">Preview JSON</button>
        `;
      } else if (mode === "template") {
        buildTemplateUI();
      }
    }

    function buildTemplateUI() {
      const area = document.getElementById("inputArea");
      let html = <h3>Template Mode</h3>;
      for (let key in templateSchema) {
        if (Array.isArray(templateSchema[key])) {
          templateSchema[key].forEach((s, i) => {
            html += `
              <div class="field">
                <label>${key}[${i}] (object):</label><br>
                ${Object.keys(s).map(k => 
                  `<label>${k}:</label><br>
                   <textarea id="${key}_${i}_${k}" rows="2"></textarea><br>`
                ).join("")}
              </div>
            `;
          });
        } else {
          html += `<label>${key}:</label><br>
                   <textarea id="${key}" rows="2"></textarea><br>`;
        }
      }
      html += <button onclick="convertTemplate()">Preview JSON</button>;
      area.innerHTML = html;
    }

    function convertBasic() {
      const rawText = document.getElementById("content").value.trim();
      const filename = document.getElementById("filename").value.trim() || "output";
      const paragraphs = rawText.split(/\n+/).map((p, i) => ({
        id: i + 1,
        content: cleanText(p)
      })).filter(p => p.content.length > 0);

      currentJSON = {
        filename: filename,
        created: new Date().toISOString(),
        sections: paragraphs
      };
      document.getElementById("preview").textContent = JSON.stringify(currentJSON, null, 2);
    }

    function convertTemplate() {
      const filename = document.getElementById("filename").value.trim() || "output";
      const result = { filename, created: new Date().toISOString() };

      for (let key in templateSchema) {
        if (Array.isArray(templateSchema[key])) {
          result[key] = templateSchema[key].map((s, i) => {
            let obj = {};
            Object.keys(s).forEach(k => {
              obj[k] = cleanText(document.getElementById(${key}_${i}_${k}).value.trim());
            });
            return obj;
          });
        } else {
          result[key] = cleanText(document.getElementById(key).value.trim());
        }
      }

      currentJSON = result;
      document.getElementById("preview").textContent = JSON.stringify(currentJSON, null, 2);
    }

    function downloadJSON() {
      if (!currentJSON) return alert("Nothing to download yet!");
      const blob = new Blob([JSON.stringify(currentJSON, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = (currentJSON.filename || "output") + ".json";
      link.click();
    }

    function loadTemplate(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          templateSchema = JSON.parse(e.target.result);
          alert("Template loaded! Switch to Template Mode to use it.");
        } catch (err) {
          alert("Invalid JSON template file.");
        }
      };
      reader.readAsText(file);
    }

    // Start in basic mode
    switchMode("basic");
  </script>
</body>
</html>
