<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WP XML + Template → JSON</title>
<style>
  body { font-family: sans-serif; padding: 1rem; background: #f5f5f5; }
  textarea { width: 100%; height: 200px; margin-top: 1rem; font-family: monospace; }
  button { margin: 0.5rem 0; padding: 0.5rem 1rem; }
  h2, h3 { margin-top: 2rem; }
  .section { margin-bottom: 1rem; }
</style>
</head>
<body>

<h2>WP XML + Template → JSON Converter</h2>

<!-- Load WP XML -->
<input type="file" id="fileInput" accept=".xml">
<button id="parseBtn">Parse XML File</button>

<h3>Parsed WP Posts Preview</h3>
<textarea id="jsonOutput" placeholder="Parsed JSON will appear here..."></textarea>

<h3>New Weekly Content Template</h3>
<div class="section">
  <label>Title</label>
  <input type="text" id="templateTitle" placeholder="Enter weekly study title" style="width:100%;">
</div>
<div class="section">
  <label>Author / Source</label>
  <input type="text" id="templateAuthor" placeholder="Author or source" style="width:100%;">
</div>
<div class="section">
  <label>Content</label>
  <textarea id="templateContent" placeholder="Paste weekly study content here..."></textarea>
</div>
<div class="section">
  <label>Notes / Extras</label>
  <textarea id="templateExtras" placeholder="Optional extra notes or links"></textarea>
</div>

<button id="generateTemplateBtn">Generate JSON from Template</button>
<textarea id="templateJsonOutput" placeholder="Template JSON will appear here..."></textarea>
<button id="downloadTemplateBtn">Download Template JSON</button>

<script>
// --- Helper to clean HTML content ---
function cleanContent(raw) {
  if (!raw) return "";
  let content = raw;
  content = content.replace(/\[.*?\]/g, ""); // Remove shortcodes
  content = content.replace(/<!--[\s\S]*?-->/g, ""); // Remove comments
  content = content.replace(/\s*style="[^"]*"/g, ""); // Remove inline styles
  content = content.replace(/<\/?span[^>]*>/g, ""); // Remove spans
  content = content.replace(/<br\s*\/?>/gi, "\n"); // <br> → newline
  content = content.replace(/<\/?[^p][^>]*>/g, ""); // Keep <p> separation only
  content = content.split(/<\/p>/i).map(p => p.replace(/<p[^>]*>/i, "").trim()).filter(p => p).join("\n\n");
  return content;
}

// --- Helper to get XML text ---
function getText(item, tag) {
  const el = item.getElementsByTagName(tag)[0];
  return el ? el.textContent : "";
}

// --- Parse WP XML ---
let parsedPosts = [];
document.getElementById("parseBtn").addEventListener("click", () => {
  const fileInput = document.getElementById("fileInput");
  if (!fileInput.files.length) return alert("Select a .xml file first");

  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    const xml = e.target.result;
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xml, "text/xml");
    const items = xmlDoc.getElementsByTagName("item");

    parsedPosts = [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const title = getText(item, "title");
      const content = cleanContent(getText(item, "content:encoded") || "");
      const excerpt = cleanContent(getText(item, "excerpt:encoded") || "");
      const link = getText(item, "link");
      const date = getText(item, "pubDate");
      parsedPosts.push({ title, content, excerpt, link, date });
    }

    document.getElementById("jsonOutput").value = JSON.stringify(parsedPosts, null, 2);
    alert(Parsed ${parsedPosts.length} posts.);
  };
  reader.readAsText(file);
});

// --- Download parsed XML JSON ---
document.getElementById("downloadBtn")?.addEventListener("click", () => {
  if (!parsedPosts.length) return alert("No parsed data to download!");
  const blob = new Blob([JSON.stringify(parsedPosts, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wp_export.json";
  a.click();
  URL.revokeObjectURL(url);
});

// --- Template JSON generation ---
document.getElementById("generateTemplateBtn").addEventListener("click", () => {
  const title = document.getElementById("templateTitle").value.trim();
  const author = document.getElementById("templateAuthor").value.trim();
  const content = cleanContent(document.getElementById("templateContent").value);
  const extras = cleanContent(document.getElementById("templateExtras").value);

  const templateJson = {
    title,
    author,
    content,
    extras,
    date: new Date().toISOString()
  };

  document.getElementById("templateJsonOutput").value = JSON.stringify(templateJson, null, 2);
});

// --- Download Template JSON ---
document.getElementById("downloadTemplateBtn").addEventListener("click", () => {
  const data = document.getElementById("templateJsonOutput").value;
  if (!data) return alert("No template JSON to download!");
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "weekly_template.json";
  a.click();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
