<input type="file" id="xmlFile" accept=".xml">
<button onclick="parseXML()">Convert WP XML → JSON</button>
<pre id="output"></pre>

<script>
function parseXML() {
  const fileInput = document.getElementById("xmlFile").files[0];
  if (!fileInput) return alert("Choose a WP XML file first!");

  const reader = new FileReader();
  reader.onload = function(e) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(e.target.result, "application/xml");

    const items = [...xml.querySelectorAll("item")];
    const json = items.map(item => ({
      title: item.querySelector("title")?.textContent || "",
      link: item.querySelector("link")?.textContent || "",
      pubDate: item.querySelector("pubDate")?.textContent || "",
      category: [...item.querySelectorAll("category")].map(c => c.textContent),
      content: item.querySelector("content\\:encoded")?.textContent || ""
    }));

    // Pretty-print JSON to screen
    document.getElementById("output").textContent = JSON.stringify(json, null, 2);

    // Auto-download JSON file
    const blob = new Blob([JSON.stringify(json, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "wordpress-export.json";
    link.click();
  };
  reader.readAsText(fileInput);
}
</script>
