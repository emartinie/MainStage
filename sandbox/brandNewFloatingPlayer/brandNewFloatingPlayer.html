<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand New Floating Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css">
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      height: 200vh; /* extra space to test scroll + floating player */
    }
    .hero-card {
      border-radius: 1rem;
      backdrop-filter: blur(8px);
      background-color: rgba(31,41,55,0.85);
      padding: 2rem;
      margin: 2rem auto;
      max-width: 600px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1 class="text-3xl text-center mt-8">Brand New Floating Player Demo</h1>
    <div id="fp-hero-glass-root"></div>


  <div class="hero-card">
    <h2 class="text-xl mb-4">Sample Content</h2>
    <p>This is just some content to test how the floating player behaves on scroll and mobile.</p>
  </div>

  <div class="hero-card">
    <h2 class="text-xl mb-4">Another Card</h2>
    <p>Scroll down and drag the floating player around. Try the docked, orbital, and floating states.</p>
  </div>

  <!-- Optional playlist -->
  <script>
    window.brandNewPlaylist = [
      { title: "Sample Track 1", eng: "audio/sample1.mp3", heb: "audio/sample1.mp3", grk: "audio/sample1.mp3", video: "videos/firevideos.mp4" },
      { title: "Sample Track 2", eng: "audio/sample2.mp3", heb: "audio/sample2.mp3", grk: "audio/sample2.mp3", video: "videos/firevideos.mp4" }
    ];
  </script>

  <!-- Load the new floating player JS -->
  <script src="js/old/ExperimentalFloatingPlayer2.0.js"></script>

</body>
</html>
