    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      color: #fff;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 600px;
      overflow: hidden;
      border-radius: 20px;
      background: #222;
      display: flex;
      flex-direction: column;
    }

    .card {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: #333;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      transition: all 0.6s ease;
    }

    .card.active {
      top: 0;
      z-index: 2;
      transform: scale(1);
    }

    .card.inactive {
      top: 100%;
      transform: scale(0.9);
      opacity: 0.6;
    }

    .controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 3;
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      background: #06f;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #08f;
    }

    .carousel-card {
  transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .carousel-card.active {
  transform: scale(1.05);
  opacity: 1;

    }
    .carousel-card.inactive {
  transform: scale(0.95);
  opacity: 0.6;
    }

    .cosmic-card {

      width: 100%;

    #map {

  <script>
    // Initialize map
    const map = L.map("card3").setView([39.5, -98.35], 4);

    // Base layer
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // Cluster group
    const markers = L.markerClusterGroup();

    // Load your GeoJSON
    fetch("HomeGroupsMap.geojson")
      .then((response) => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then((data) => {
        data.features.forEach((feature, idx) => {
          const coordsStr = feature.properties.Coordinates;
          if (!coordsStr) {
            console.warn`(Feature ${idx} missing Coordinates)`;
            return;
          }
          const coords = coordsStr.split(",").map(Number);
          if (coords.length < 2) {
            console.warn`(Feature ${idx} has invalid Coordinates)`;
            return;
          }
          const [lon, lat] = coords;

          // Create marker using coordinates
          const marker = L.marker([lat, lon]);

          // Bind popup (name + optional extra info)
          marker.bindPopup(
            `<strong>${feature.properties.Name || "Unnamed"}</strong>`
          );

          markers.addLayer(marker);
        });

        // Add cluster group to map
        map.addLayer(markers);
      })
      .catch((err) => console.error("Error loading GeoJSON:", err));
  </script>

  <script>
    function showCard(num) {
      document.querySelectorAll('.card').forEach((card, idx) => {
        if (idx + 1 === num) {
          card.classList.add('active');
          card.classList.remove('inactive');
        } else {
          card.classList.remove('active');
          card.classList.add('inactive');
        }
      });
    }
  </script>

  <script>
  // --- Debounce helper ---
    function debounce(fn, delay = 250) {
    let timer;
    return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
    };
}

// --- Advanced search ---
function setupAdvancedSearch() {
    const searchInput = document.getElementById("advancedsearchInput");
    if (!searchInput) return;
    const searchFn = debounce(() => {
        const query = searchInput.value.toLowerCase();
        const cards = document.querySelectorAll("#cardsContainer section");
        let visibleCount = 0;
        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            if (text.includes(query)) {
                card.style.display = "";
                visibleCount++;
            } else {
                card.style.display = "none";
            }
        });

        // Optional: show "No results" placeholder
        let noResults = document.getElementById("noResultsPlaceholder");
        if (!noResults) {
            noResults = document.createElement("p");
            noResults.id = "noResultsPlaceholder";
            noResults.className = "text-center text-gray-400 dark:text-gray-300 mt-4";
            noResults.textContent = "No matching cards found.";
            cardsContainer.parentNode.appendChild(noResults);
        }
        noResults.style.display = visibleCount === 0 ? "block" : "none";
    }, 200);

    searchInput.addEventListener("input", searchFn);
}

// --- Reset button ---
function addSearchResetButton() {
    const searchWrapper = document.getElementById("searchWrapper");
    const searchInput = document.getElementById("advancedsearchInput");
    if (!searchInput || !searchWrapper) return;

    const resetBtn = document.createElement("button");
    resetBtn.textContent = "Reset";
    resetBtn.className = "ml-2 px-2 py-1 bg-gray-300 dark:bg-gray-600 rounded hover:bg-gray-400 dark:hover:bg-gray-500 text-gray-800 dark:text-gray-200";
    resetBtn.addEventListener("click", () => {
        searchInput.value = "";
        document.querySelectorAll("#cardsContainer section").forEach(card => card.style.display = "");
        const noResults = document.getElementById("noResultsPlaceholder");
        if (noResults) noResults.style.display = "none";
    });

    searchWrapper.appendChild(resetBtn); // append inside the flex container
}
