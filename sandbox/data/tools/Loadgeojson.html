<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map Preview & Converter</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  body { margin:0; padding:0; }
  #map { width: 100%; height: 90vh; }
  #controls { padding: 10px; }
</style>
</head>
<body>

<div id="controls">
  <input type="file" id="jsonInput" accept=".json">
  <button id="saveJsonBtn">Save JSON</button>
</div>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- MarkerCluster JS -->
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
const map = L.map('map').setView([39.5, -98.35], 4); // USA center

// Add OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markersCluster = L.markerClusterGroup();
let loadedData = null;

// Convert your "Coordinates" string to LatLng
function parseCoordinates(coordStr) {
  if (!coordStr) return null;
  const parts = coordStr.split(',').map(Number);
  if (parts.length < 2) return null;
  return [parts[1], parts[0]]; // Leaflet uses [lat, lng]
}

// Load markers from JSON
function loadMarkers(data) {
  markersCluster.clearLayers();
  data.features.forEach(feature => {
    const coords = parseCoordinates(feature.properties.Coordinates);
    if (coords) {
      const popupContent = `
        <strong>${feature.properties.Name}</strong><br>
        ${feature.properties.description.replace(/\s+/g, ' ')}
      `;
      const marker = L.marker(coords).bindPopup(popupContent);
      markersCluster.addLayer(marker);
    }
  });
  map.addLayer(markersCluster);
}

// Input JSON file handler
document.getElementById('jsonInput').addEventListener('change', function(evt){
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      loadedData = JSON.parse(e.target.result);
      loadMarkers(loadedData);
      alert('Markers loaded!');
    } catch (err) {
      alert('Invalid JSON file.');
      console.error(err);
    }
  };
  reader.readAsText(file);
});

// Save JSON button
document.getElementById('saveJsonBtn').addEventListener('click', function(){
  if (!loadedData) return alert('No data loaded!');
  const blob = new Blob([JSON.stringify(loadedData, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'exported_map.json';
  a.click();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
