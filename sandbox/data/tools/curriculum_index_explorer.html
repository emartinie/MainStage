<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Curriculum Explorer</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    ul { list-style-type: none; padding-left: 20px; }
    li { margin: 4px 0; }
    .folder { font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
    .file { color: #0066cc; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Curriculum Explorer</h1>
  <div id="tree"></div>

  <script>
    async function loadJSON() {
      const res = await fetch('curriculum_index.json');
      const files = await res.json();

      const treeData = {};

      // Build folder tree from JSON
      files.forEach(file => {
        const parts = file.path.split(/[\\/]/); // handles both slashes
        let current = treeData;

        for (let i = 0; i < parts.length; i++) {
          const part = parts[i];
          if (i === parts.length - 1) {
            // File
            current[part] = { __file: file };
          } else {
            if (!current[part]) current[part] = {};
            current = current[part];
          }
        }
      });

      const treeDiv = document.getElementById('tree');
      treeDiv.appendChild(renderTree(treeData));
    }

    function renderTree(node) {
      const ul = document.createElement('ul');

      Object.keys(node).sort().forEach(key => {
        const li = document.createElement('li');

        if (node[key].__file) {
          // File
          li.textContent = key + ` (${node[key].type}${node[key].numPages ? ', ' + node[key].numPages + ' pages' : ''})`;
          li.className = 'file';
          li.onclick = () => alert(JSON.stringify(node[key].__file, null, 2));
        } else {
          // Folder
          li.textContent = key;
          li.className = 'folder';
          const children = renderTree(node[key]);
          children.classList.add('hidden');
          li.appendChild(children);

          li.onclick = e => {
            e.stopPropagation();
            children.classList.toggle('hidden');
          };
        }

        ul.appendChild(li);
      });

      return ul;
    }

    loadJSON();
  </script>
</body>
</html>
