<input type="file" id="kmlFile" accept=".kml,.xml">
<pre id="jsonOutput" style="max-height:400px; overflow:auto; background:#111; color:#0f0; padding:10px;"></pre>

<script>
document.getElementById('kmlFile').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const text = await file.text();
  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "application/xml");

  const placemarks = Array.from(xml.getElementsByTagName('Placemark'));
  const output = placemarks.map(pm => {
    // Name
    const name = pm.getElementsByTagName('name')[0]?.textContent || null;

    // Description or ExtendedData
    const extendedData = pm.getElementsByTagName('ExtendedData')[0];
    let address = null, email = null, phone = null;
    if (extendedData) {
      Array.from(extendedData.getElementsByTagName('Data')).forEach(d => {
        const key = d.getAttribute('name')?.toLowerCase();
        const value = d.getElementsByTagName('value')[0]?.textContent || null;
        if (!value) return;
        if (key.includes('description') || key.includes('address')) address = value;
        else if (key.includes('email')) email = value;
        else if (key.includes('phone')) phone = value;
      });
    }

    // Coordinates
    let coordsText = pm.getElementsByTagName('coordinates')[0]?.textContent || "";
    coordsText = coordsText.trim().split(',');
    const lng = parseFloat(coordsText[0]) || null;
    const lat = parseFloat(coordsText[1]) || null;

    return { name, address, email, phone, lat, lng };
  });

  // Display JSON
  document.getElementById('jsonOutput').textContent = JSON.stringify(output, null, 2);
});
</script>
