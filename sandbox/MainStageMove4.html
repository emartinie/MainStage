<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4a5568">
  <title>Sandbox-Bible MainStage</title>
    <link rel="icon" type="image/x-icon" href="images/HGHouses.png">
  <link rel="stylesheet" href="css/cosmicbadass.css">
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .cosmic-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh; /* full viewport height for testing */
      min-height: 300px;
    }

    #map {
      flex-grow: 1;
      width: 100%;
    }

/* Optional: force the floating player to scale on small screens */
.floating-player {
  max-width: 90vw;
  max-height: 90vh;
  position: fixed;
  bottom: 1rem;
  right: 1rem;
  z-index: 9999;
}

    /* Optional bounce animation for hero card */
    @keyframes bounce-slow { 0%,100%{transform:translateY(-5%);}50%{transform:translateY(5%);} }
    .animate-bounce-slow { animation: bounce-slow 2s infinite; }

  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-200 flex flex-col min-h-screen">
<main class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-screen-lg">
<main>

  <!-- Header -->
   <button id="installBtn" style="display:none;">
   📲 Install App
    </button> 
  <header class="sticky top-0 z-50  flex justify-between items-left px-4 py-2 bg-gray-900/80 backdrop-blur-sm py-2 shadow-inner">
    <div class="flex items-center gap-2">
      <img src="images/HGHouses.png" alt="Logo" class="h-14 animate-bounce-slow">
      <h1 class="text-xl font-bold"> </h1>
    </div>
    <div class="flex items-center gap-2">
  
    <button id="prevWeek" class="px-2 py-1 border rounded">Prev</button>
      <select id="weekSelect" class="px-2 py-1 border rounded text-blue-600"></select>
      <button id="nextWeek" class="px-2 py-1 border rounded">Next</button>
    </div>
  </header>
<div id="weekInfo"></div>


<section class="carousel-container relative overflow-hidden w-full max-w-3xl mx-auto">
  <!-- Track -->
  <div class="carousel-track flex transition-transform duration-500 ease-in-out">
    <!-- MainCard 1 -->

    <div class="carousel-card main-card"> 
    <div id="mainStageCard" style="flex: 0 0 100%; padding: 20px; box-sizing: border-box;" >
      <h2>MainCard 1</h2>
  <section  class="hero-card relative border rounded-3xl shadow-2xl bg-gray-900/70 backdrop-blur-lg text-white p-6 mx-auto max-w-4xl transform transition-transform duration-500 hover:scale-105 hover:shadow-3xl">

<!-- Background video -->
  <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover rounded-3xl -z-10 opacity-30">
    <source src="videos/bg-motion.mp4" type="video/mp4">
  </video>
  <div class="relative z-10 space-y-3">  <marquee behavior="scroll" direction="right">
  <p id="nowPlaying" class="mt-1 text-sm text-blue-600 dark:text-blue-400"></p>
  </marquee>
    <h2 class="text-3xl font-extrabold tracking-wide drop-shadow-lg">Weekly Bible Studies</h2>
    <p class="text-gray-300 text-lg">English / Hebrew / Greek</p>

    <div class="mb-4">
      <h2 id="mainStageTitle" class="text-2xl font-bold">Weekly Bible Studies</h2>
      <p id="mainStageSub" class="text-gray-600 dark:text-gray-300">English / Hebrew / Transliteration</p>
    </div>
     <!-- Floating Player -->
    <div id="fp-hero-glass-root"></div>
 
  <!-- Trigger buttons -->
  <button id="openVersePopup" class="px-2 py-1 border rounded" style="float: left;">Show Verses</button>
  <button id="openVideoPopup" class="px-2 py-1 border rounded" style="float: right;">Show Video</button>
  <marquee behavior="scroll" direction="right">
  <p id="nowPlaying" class="mt-1 text-sm text-blue-600 dark:text-blue-400"></p>
  </marquee>
 
  <h2>AudioVisual Scriptures</h2>
  <div id="mainStagePlaylist" class="grid gap-2 sm:grid-cols-2 mb-4"></div>

  <!-- Scripture Popup -->
  <div id="versePopup" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <iframe id="verseIframe" class="bg-white dark:bg-gray-800 rounded-lg" style="width:90%; max-width:600px; height:80vh; border:none;"></iframe>
  <button id="closeVersePopup" class="absolute top-4 right-4 px-3 py-1 rounded bg-red-400 text-white z-50">Close</button>
  </div>

  <!-- Video Popup -->
  <div id="videoPopup" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <iframe id="videoIframe" class="bg-white dark:bg-gray-800 rounded-lg" style="width:90%; max-width:600px; height:80vh; border:none;"></iframe>
  <button id="closeVideoPopup" class="absolute top-4 right-4 px-3 py-1 rounded bg-red-400 text-white z-50">Close</button>
  </div>
    <h2>Chapter Outlines</h2>
  <!-- Chapter Outlines (under playlist) -->
    <div id="mainStageChapters" class="mb-4 p-3 bg-gray-50 dark:bg-gray-700 rounded-xl shadow-inner space-y-2 text-gray-700 dark:text-gray-300 max-w-100%"></div>
    <div id="mainStageVideo" class="w-full aspect-video hidden mb-4 max-w-100%">
    <iframe src="" frameborder="0" allowfullscreen class="w-full h-full rounded-lg"></iframe>
    </div>
  </section>      

<button class="carousel-action">Do Something</button>
  </div>



  <!-- Prev Button -->
  <button 
    class="carousel-prev absolute top-1/2 left-2 -translate-y-1/2 bg-gray-800/70 hover:bg-blue-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg backdrop-blur-md transition">
    ◀
  </button>

  <!-- Next Button -->
  <button 
    class="carousel-next absolute top-1/2 right-2 -translate-y-1/2 bg-gray-800/70 hover:bg-blue-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg backdrop-blur-md transition">
    ▶
  </button>

  <!-- Dots -->
  <div class="carousel-dots absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2">
    <!-- JS will inject dots dynamically -->
  </div>
</section>

<script>
  const track = document.querySelector('.carousel-track');
  const cards = document.querySelectorAll('.carousel-card');
  const prevBtn = document.querySelector('.carousel-prev');
  const nextBtn = document.querySelector('.carousel-next');
  const dotsContainer = document.querySelector('.carousel-dots');

  let currentIndex = 0;

  // Create dots
  cards.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = "w-3 h-3 rounded-full bg-gray-400 hover:bg-blue-400 transition";
    if (i === 0) dot.classList.add("bg-blue-600", "scale-125");
    dot.addEventListener('click', () => {
      currentIndex = i;
      updateCarousel();
    });
    dotsContainer.appendChild(dot);
  });

  const dots = dotsContainer.querySelectorAll('button');

  function updateCarousel() {
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
    dots.forEach((dot, i) => {
      dot.className = "w-3 h-3 rounded-full bg-gray-400 hover:bg-blue-400 transition";
      if (i === currentIndex) dot.classList.add("bg-blue-600", "scale-125");
    });
  }

  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    updateCarousel();
  });

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % cards.length;
    updateCarousel();
  });

  // Touch swipe
  let startX = 0;
  let isDragging = false;
  track.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    isDragging = true;
  });
  track.addEventListener('touchend', e => {
    if (!isDragging) return;
    isDragging = false;
    const diff = e.changedTouches[0].clientX - startX;
    if (diff > 50) currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    if (diff < -50) currentIndex = (currentIndex + 1) % cards.length;
    updateCarousel();
  });
</script>
