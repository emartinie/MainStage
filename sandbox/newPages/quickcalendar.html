<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar Quick Test</title>
<script defer src="quickCalendarTest.js"></script>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; }
  #calendarCard { max-width:400px; margin:2rem auto; }
</style>
</head>
<body>

<!-- 🔮 Universal Glass Modal -->
<div id="modalContainer" class="fixed inset-0 hidden items-center justify-center bg-black/50 z-50">
  <div class="modal glass rounded-xl shadow-xl max-w-md w-[90%] max-h-[90%] overflow-y-auto p-4 relative">
    <button class="absolute top-2 right-2 text-gray-400 hover:text-white" onclick="closeModal()">
      ✕
    </button>
    <div id="modalContent" class="text-sm text-gray-100 space-y-4">
      <!-- dynamic content goes here -->
    </div>
  </div>
</div>

<script>
function openModal(contentHtml) {
  const modal = document.getElementById("modalContainer");
  const content = document.getElementById("modalContent");
  content.innerHTML = contentHtml;
  modal.classList.remove("hidden");
  modal.classList.add("flex");
}

function closeModal() {
  const modal = document.getElementById("modalContainer");
  modal.classList.remove("flex");
  modal.classList.add("hidden");
}


</script>

<div class="bibleCard inactive absolute flex items-center justify-center rounded-xl shadow-lg flex flex-col">
<!-- Cosmic Badass Calendar Card -->
<section id="calendarCard" class="hero-card relative border rounded-3xl shadow-2xl bg-gray-900/70 backdrop-blur-lg text-white p-6 mx-auto max-w-4xl transform transition-transform duration-500 hover:scale-105 hover:shadow-3xl flex flex-col">
  <!-- Background video -->
  <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover rounded-3xl opacity-30">
    <source src="videos/firevideos.mp4" type="video/mp4">
  </video>
     

<section id="calendarCard" class="hero-card relative border rounded-3xl shadow-2xl bg-gray-900/70 backdrop-blur-lg text-white p-6 flex flex-col">
  <h2>Cosmic Calendar Preview</h2>
  <div id="astroInfo" class="space-y-2 text-sm">
    <!-- Dummy real-time style data -->
    <p>Sunrise: 06:23</p>
    <p>Moonphase: Waxing Gibbous</p>
    <p>Stars/Constellations: Orion, Taurus</p>
  </div>
  <div id="calendarInfo" class="space-y-1 text-sm mt-4">
    <p>Remaining HolyDays: 10</p>
    <p>Days to Prepare: 3</p>
    <p>Locations: <a href="#">Jerusalem</a>, <a href="#">Synagogues</a></p>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const astro = document.getElementById("astroInfo");
  const cal = document.getElementById("calendarInfo");

  // Fake dynamic update every 3 seconds
  setInterval(()=>{
    const sunHour = 6 + Math.floor(Math.random()*2);
    const sunMin = Math.floor(Math.random()*60).toString().padStart(2,'0');
    astro.querySelector("p:nth-child(1)").textContent = `Sunrise: ${sunHour}:${sunMin}`;

    const moonPhases = ["New Moon","Waxing Crescent","First Quarter","Waxing Gibbous","Full Moon","Waning Gibbous","Last Quarter","Waning Crescent"];
    const moon = moonPhases[Math.floor(Math.random()*moonPhases.length)];
    astro.querySelector("p:nth-child(2)").textContent = `Moonphase: ${moon}`;

    // Calendar info pseudo-random
    const remaining = 5 + Math.floor(Math.random()*10);
    const prepare = 1 + Math.floor(Math.random()*5);
    cal.querySelector("p:nth-child(1)").textContent = `Remaining HolyDays: ${remaining}`;
    cal.querySelector("p:nth-child(2)").textContent = `Days to Prepare: ${prepare}`;
  },3000);
});
</script>

</body>
</html>
