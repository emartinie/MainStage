<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Study Week 50</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<header id="main-header">
  <h1>Superfly Bible Study</h1>
  <nav>
    <button id="toggle-week">Week Info</button>
    <button id="toggle-player">Player</button>
  </nav>
</header>

<main id="study-root">
  <!-- Week Intro -->
  <section id="week-intro" class="cosmic-card">
    <h2 id="week-title"></h2>
    <p id="week-summary"></p>
    <p id="week-instructions"></p>
  </section>

  <!-- Audio Playlist (Floating Player will handle playback) -->
  <section id="audio-playlist" class="cosmic-card"></section>

  <!-- Chapters / Outlines -->
  <section id="chapter-outlines" class="cosmic-card"></section>

  <!-- Scripture Text -->
  <section id="scripture-text" class="cosmic-card"></section>

  <!-- Commentary -->
  <section id="commentary" class="cosmic-card"></section>

  <!-- Deeper Learning -->
  <section id="deeper-learning" class="cosmic-card"></section>

  <!-- Aleph-Tav Highlights -->
  <section id="aleph-tav" class="cosmic-card"></section>

  <!-- Kids Study -->
  <section id="kids-study" class="cosmic-card"></section>

  <!-- Language Learning -->
  <section id="language-learning" class="cosmic-card"></section>

  <!-- Psalms Plan -->
  <section id="psalms-plan" class="cosmic-card"></section>
</main>

<!-- Floating Player Placeholder -->
<div id="fp-hero-glass-root"></div>

<footer id="main-footer">
  <p>&copy; 5785 Bible Study Universe</p>
</footer>

<script src="js/floatingPlayer-v3.js"></script>
<script src="appLoader.js"></script>
</body>
</html>
