<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leaflet Map Card</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
    #sidebar {
      width: 250px; background: #f7f7f7; padding: 10px; overflow-y: auto;
      border-right: 1px solid #ddd;
    }
    #map {
      flex: 1; height: 100%;
    }
    .filter-card {
      background: white; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px;
    }
    .leaflet-popup-content {
      font-size: 14px;
    }
    button.contact-btn {
      display: block; margin-top: 6px; padding: 6px 10px;
      border: none; background: #0078ff; color: white; border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar">
    <h3>Filters</h3>
    <div class="filter-card">
      <label>Zipcode:</label><br>
      <input type="text" id="filterZip" placeholder="Enter zip..." />
    </div>
    <div class="filter-card">
      <label>Denomination:</label><br>
      <select id="filterDenom">
        <option value="">Any</option>
        <option>Non-denominational</option>
        <option>Catholic</option>
        <option>Baptist</option>
      </select>
    </div>
    <button onclick="applyFilters()">Apply Filters</button>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Init map
    const map = L.map('map').setView([39.5, -98.35], 4); // USA center
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    let markers = [];
    let allData = [];

    // Load GeoJSON data
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        allData = data.features;
        renderMarkers(allData);
      });

    function renderMarkers(dataset) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      dataset.forEach(f => {
        let coords = f.geometry.coordinates;
        let props = f.properties;

        // Obfuscate location a bit
        let lat = coords[1] + (Math.random() - 0.5) * 0.002;
        let lng = coords[0] + (Math.random() - 0.5) * 0.002;

        let marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup(`
          <strong>${props.group}</strong><br>
          Zip: ${props.zipcode}<br>
          Denomination: ${props.denomination}<br>
          <button class="contact-btn" onclick="contact('${props.id}')">Contact</button>
        `);
        markers.push(marker);
      });
    }

    function applyFilters() {
      let zip = document.getElementById("filterZip").value.trim();
      let denom = document.getElementById("filterDenom").value;

      let filtered = allData.filter(f => {
        let matchZip = zip ? f.properties.zipcode.startsWith(zip) : true;
        let matchDenom = denom ? f.properties.denomination === denom : true;
        return matchZip && matchDenom;
      });

      renderMarkers(filtered);
    }

    function contact(id) {
      alert("Contact form would open for ID: " + id);
    }
  </script>
</body>
</html>
