<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anime Hub - Top 500</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Card sparkles on tap */
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(1) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.1) rotate(10deg); }
  }
  .sparkle-active {
    animation: sparkle 0.5s ease-in-out;
  }

  /* Overlay for mobile touch */
  .overlay {
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s ease-in-out;
  }
  .overlay-active {
    opacity: 1 !important;
    transform: translateY(0) !important;
  }

  /* Floating TTS player */
  #tts-player {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    background: rgba(75, 0, 130, 0.85);
    color: white;
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    display: none;
    z-index: 1000;
    font-size: 1rem;
  }
</style>
</head>
<body class="bg-gray-900 text-white font-sans">

<header class="bg-purple-800 p-4 shadow-lg sticky top-0 z-50 flex flex-col sm:flex-row items-center justify-between gap-2">
  <img src="logo.png" alt="Anime Hub Logo" class="h-12 w-12 object-contain">
  <h1 class="text-2xl sm:text-3xl font-bold text-center flex-1">Anime Hub - Top 500</h1>
  <select id="tts-voice" class="bg-gray-700 text-white p-2 rounded">
    <option value="default">Default</option>
    <option value="ja-JP">Japanese</option>
    <option value="en-US">English</option>
  </select>
</header>

<main class="p-4 sm:p-6">
  <!-- Search input -->
  <section id="controls" class="mb-4">
    <input id="search-input" type="text" placeholder="Search by title, Japanese, voice actor, genre..." class="p-2 rounded w-full text-black text-sm sm:text-base">
  </section>

  <!-- Anime Grid -->
  <section id="anime-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
    <!-- Cards inserted here -->
  </section>
</main>

<div id="tts-player">
  <span id="tts-text"></span>
  <button id="tts-pause" class="ml-2 bg-blue-500 px-2 py-1 rounded hover:bg-blue-600">⏸</button>
  <button id="tts-stop" class="ml-1 bg-red-500 px-2 py-1 rounded hover:bg-red-600">⏹</button>
</div>

<script>
let animeData = [];
let voices = [];
let ttsUtterance;

async function loadAnime() {
  const res = await fetch('anime_full_mapped.json');
  const data = await res.json();
  animeData = data.anime;

  renderGrid(animeData);
  initTTS();
}

function renderGrid(list) {
  const grid = document.getElementById('anime-grid');
  grid.innerHTML = '';

  list.forEach(a => {
    const card = document.createElement('div');
    card.className = "card relative bg-gray-800 rounded-lg overflow-hidden shadow-lg transform transition hover:scale-105";

    card.innerHTML = `
      <img src="${a.coverImage.large}" alt="${a.title.romaji}" class="w-full h-64 object-cover" loading="lazy">
      <div class="p-4 text-sm sm:text-base">
        <h2 class="text-lg sm:text-xl font-bold">${a.title.romaji}</h2>
        <h3 class="text-purple-400 text-base sm:text-lg drop-shadow-md">${a.title.native || ''}</h3>
        <p class="text-gray-300 mt-1 sm:mt-2">Episodes: ${a.episodes || 'N/A'} | Type: ${a.format}</p>
        <p class="text-gray-300 text-xs sm:text-sm">Genres: ${a.genres.join(', ')}</p>
        <p class="text-gray-300 text-xs sm:text-sm">Popularity: ${a.popularity || 'N/A'} | Score: ${a.averageScore || 'N/A'}</p>
      </div>
      <div class="overlay absolute inset-0 bg-black bg-opacity-80 text-white p-3 flex flex-col justify-between">
        <div class="overflow-y-auto max-h-48 text-xs sm:text-sm">
          <h4 class="font-bold mb-1">Characters & Voice Actors</h4>
          <ul>
            ${
              a.characters?.edges?.map(c => `<li>${c.node.name.full} - ${(c.voiceActors?.map(v => v.name.full).join(', ') || 'N/A')}</li>`).join('') || 'No characters'
            }
          </ul>
        </div>
        <div class="mt-2">
          <button class="bg-blue-500 px-2 py-1 rounded hover:bg-blue-600 text-xs sm:text-sm tts-btn" data-text="${a.title.romaji} - ${a.title.native || ''}">🔊 Read</button>
        </div>
      </div>
    `;

    // Toggle overlay on touch/click
    const overlay = card.querySelector('.overlay');
    card.addEventListener('click', () => {
      overlay.classList.toggle('overlay-active');
      card.classList.add('sparkle-active');
      setTimeout(() => card.classList.remove('sparkle-active'), 500);
    });

    grid.appendChild(card);
  });

  // Wire TTS buttons
  document.querySelectorAll('.tts-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation(); // prevent card click from toggling overlay
      playTTS(btn.dataset.text);
    });
  });
}

function initTTS() {
  voices = window.speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); };
}

function playTTS(text) {
  const voiceSelect = document.getElementById('tts-voice');
  const voiceLang = voiceSelect.value;

  ttsUtterance = new SpeechSynthesisUtterance(text);
  if (voiceLang !== 'default') {
    const voice = voices.find(v => v.lang === voiceLang);
    if (voice) ttsUtterance.voice = voice;
  }
  ttsUtterance.rate = 1; ttsUtterance.pitch = 1;
  ttsUtterance.onstart = () => { 
    document.getElementById('tts-text').textContent = text; 
    document.getElementById('tts-player').style.display = 'block'; 
  };
  ttsUtterance.onend = () => { 
    document.getElementById('tts-player').style.display = 'none'; 
  };

  window.speechSynthesis.speak(ttsUtterance);
}

// TTS player controls
document.getElementById('tts-pause').addEventListener('click', ()=>{if(window.speechSynthesis.speaking) window.speechSynthesis.pause();});
document.getElementById('tts-stop').addEventListener('click', ()=>{window.speechSynthesis.cancel(); document.getElementById('tts-player').style.display='none';});

loadAnime();
</script>

</body>
</html>
