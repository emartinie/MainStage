<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f2937">
<title>HGBibleApp - Superfly MainStage PWA</title>
<link rel="icon" href="images/HGHouses.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet "href="css/ExperimentalFloatingPlayer2.css"/>
<link rel="stylesheet "href="css/styles.css"/>
<style>

/* General Dark/Glassy 3D look */
body {
  font-family: 'Inter', sans-serif;
  background: #111827;
  color: #f9fafb;
}

/* Hero/MainStage */
.hero-card {
  position: relative;
  overflow: hidden;
  border-radius: 2rem;
  background: rgba(30,41,59,0.85);
  backdrop-filter: blur(15px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  padding: 2rem;
  margin-bottom: 2rem;
  transform-style: preserve-3d;
  perspective: 1000px;
}
.hero-card h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 2.5rem;
  font-weight: 800;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
}
.hero-card p {
  font-size: 1.1rem;
  margin-top: 0.5rem;
}

/* Floating Player */
.floating-player {
  position: fixed;
  bottom: 1rem;
  right: 1rem;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: transform 0.3s ease;
}
.floating-player:hover {
  transform: scale(1.1);
}

/* Hero Animation */
@keyframes bounce-slow { 0%,100%{transform:translateY(-5%);}50%{transform:translateY(5%);} }
.animate-bounce-slow { animation: bounce-slow 2s infinite; }

/* 3D Cards */
.card {
  background: rgba(30,41,59,0.9);
  border-radius: 1.5rem;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  padding: 1.5rem;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
  transform: translateY(-10px) rotateX(5deg) rotateY(5deg);
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
}

/* Calendar Card */
#calendarCard {
  background: rgba(30,41,59,0.85);
  backdrop-filter: blur(15px);
  border-radius: 2rem;
  padding: 1.5rem;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* Buttons */
button {
  transition: transform 0.2s ease, background 0.2s ease;
}
button:hover {
  transform: translateY(-2px);
  background: rgba(59,130,246,0.8);
}

/* Scrollable containers */
.scroll-container {
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: #3b82f6 #1f2937;
}
.scroll-container::-webkit-scrollbar {
  height: 8px;
}
.scroll-container::-webkit-scrollbar-thumb {
  background-color: #3b82f6;
  border-radius: 4px;
}
.scroll-container::-webkit-scrollbar-track {
  background-color: #1f2937;
}
</style>
</head>
<body class="flex flex-col min-h-screen">

<main class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-screen-lg">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-gray-900/80 backdrop-blur-sm shadow-md flex justify-between items-center px-4 py-2">
    <div class="flex items-center gap-2">
      <img src="images/HGHouses.png" alt="Logo" class="h-14 animate-bounce-slow">
      <h1 class="text-2xl font-extrabold tracking-wide text-blue-400">HGBibleApp</h1>
    </div>
    <button id="installBtn" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600" style="display:none;">📲 Install App</button>
  </header>

<!-- Hero/MainStage Card -->
<section id="mainStageCard" class="hero-card relative border rounded-3xl shadow-2xl bg-gray-900/70 backdrop-blur-lg text-white p-6 mx-auto max-w-4xl transform transition-transform duration-500 hover:scale-105 hover:shadow-3xl">
  <!-- Background video -->
  <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover rounded-3xl -z-10 opacity-30">
    <source src="videos/bg-motion.mp4" type="video/mp4">
  </video>

  <div class="relative z-10 space-y-3">
    <h2 class="text-3xl font-extrabold tracking-wide drop-shadow-lg">Weekly Bible Studies</h2>
    <p class="text-gray-300 text-lg">English / Hebrew / Transliteration</p>

<!-- Floating Player v3 — Hero Glass Edition -->
<div id="fp-hero-glass-root" aria-hidden="false"></div>

  <!-- Calendar Card -->
  <section id="calendarCard" class="mb-6">
    <h3 class="text-xl font-bold mb-2">Next Holy Day: Trumpets (יוֹם תְּרוּעָה) Yom Teruah, Rosh Hashanah</h3>
    <p id="nextHolyDay" class="px-2 py-1 border rounded">Dynamically rendering times/dates...</p>
    <p id="daysToPrepare" class="px-2 py-1 border rounded"></p>
    <p id="locationHint" class="px-2 py-1 border rounded"></p>
    <div id="miniCalendar" class="mt-3 p-2 bg-gray-800/50 rounded scroll-container">
      <!-- dynamically render days/weeks -->
    </div>
    <div class="mt-3 flex gap-2 flex-wrap">
      <button id="filterHillel" class="px-2 py-1 border rounded">Hillel</button>
      <button id="filterEnochian" class="px-2 py-1 border rounded">Enochian</button>
      <button id="filterZedokian" class="px-2 py-1 border rounded">Zedokian</button>
      <button id="filterOrthodox" class="px-2 py-1 border rounded">Orthodox</button>
      <button id="filterMSChristian" class="px-2 py-1 border rounded">MS Christian</button>
    </div>
  </section>

  <!-- Cards Container -->
  <section id="cardsContainer" class="space-y-6"></section>

  <!-- Footer -->
  <footer class="sticky bottom-0 bg-gray-900/80 backdrop-blur-sm text-center py-2 shadow-inner">
    <div class="flex justify-center gap-2 p-2">
      <input id="advancedsearchInput" type="text" placeholder="Search Scriptures..." class="px-2 py-1 rounded flex-1 bg-gray-800 text-white border border-gray-600">
      <button id="darkModeToggle" class="px-3 py-1 bg-gray-700 text-white rounded">Dark</button>
      <button id="searchResetBtn" class="px-3 py-1 bg-gray-700 text-white rounded">Reset</button>
    </div>
    <p class="mt-2">&copy; 2025 HGBibleApp</p>
  </footer>
</main>

<script>
// Dark mode toggle
document.getElementById('darkModeToggle').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
});

// Example floating player click
document.getElementById('floating-player').addEventListener('click', () => {
  alert('Floating player clicked!');
});
</script>
  <!-- Main Scripts -->
  <script src="js/basemainLoader.js" defer></script>
  <script src="js/ExperimentalFloatingPlayer2.0.js" defer></script>
  <script src="app.js" defer></script> 

</body>
</html>
